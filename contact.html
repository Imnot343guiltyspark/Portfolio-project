<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css"
    />
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-contact">
    <header>
      <div class="container">
        <nav>
          <a href="index.html" class="logo">
            <img src="images/logo.svg" alt="Ricardo Galindo logo" />
          </a>
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Projects</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="head-text container">
        <h1>Get in touch</h1>
      </section>
      <form action="#" method="POST" class="contact-form container">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group form-group--full">
          <label for="message">Message</label>
          <textarea name="message" id="message" required></textarea>
        </div>
        <button type="submit" class="cta">Send</button>
      </form>
      <section class="socials-block container">
        <p>Find me on...</p>
        <div class="socials-media">
          <a href="#" aria-label="Whatsapp">Whatsapp</a>
          <a href="#" aria-label="Facebook">Facebook</a>
          <a href="#" aria-label="Instagram">Instagram</a>
          <a href="#" aria-label="LinkedIn">LinkedIn</a>
        </div>
      </section>
    </main>
    <footer class="container">
      <div class="footer-info">
        <p>Phone: +52 55 4536 3646</p>
        <p>
          Email:
          <a href="mailto:ricardogalind8@gmail.com">ricardogalind8@gmail.com</a>
        </p>
      </div>
      <div class="social-links">
        <a href="#" aria-label="Instagram">Instagram</a>
        <a href="#" aria-label="Facebook">Facebook</a>
      </div>
    </footer>
  </body>
</html>
